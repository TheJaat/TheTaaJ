[package]
name = "fuzz"
version = "0.1.0"
edition = "2021"
description = "TheTaaJ's parsers of untrusted input, fuzzed on the host (K189)"
publish = false

# Built by tools/fuzz.sh, not by plain `cargo build`: each target is
# compiled with LLVM's coverage hooks and linked with libFuzzer
# (LLVM's own, from the project's LLVM 18.1.3) - no crate from outside,
# as the kernel's own Cargo.toml asks. See src/lib.rs.

[dependencies]
kernel64 = { path = "../kernel/kernel64" }
acpi = { path = "../acpi" }
usb = { path = "../usb" }
net = { path = "../net" }
taajfs = { path = "../taajfs" }
fileserver = { path = "../fileserver" }

[profile.release]
# The checks host tests have: an overflow found here is one the kernel
# would have wrapped round silently.
debug-assertions = true
overflow-checks = true
debug = 1

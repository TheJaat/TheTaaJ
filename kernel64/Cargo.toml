[package]
name = "kernel64"
version = "0.1.0"
edition = "2021"
description = "The 64-bit TheTaaJ kernel"
publish = false

[[bin]]
name = "kernel64"
path = "src/main.rs"
# A kernel has no test harness to run its tests in (yet), and `cargo
# test` would try to build one against `std`.
test = false
bench = false

[dependencies]
# Only our own: the system call interface, shared with user programs.
# Every line of the kernel is ours to read.
abi = { path = "../abi" }

[features]
# Deliberately fault after booting, to check that each protection holds
# and each handler reports it correctly. Never in a normal build; `make
# fault64-test` builds and boots each in turn.
fault-tests = []                    # (internal: the shared test code)
fault-page = ["fault-tests"]        # read unmapped memory
fault-double = ["fault-tests"]      # an exception with no usable stack
fault-rodata = ["fault-tests"]      # write to read-only data
fault-nx = ["fault-tests"]          # execute data
fault-stack = ["fault-tests"]       # overflow the boot stack
fault-thread-stack = ["fault-tests"] # overflow a kernel thread's stack

# No unwinding: there is nothing to unwind into. A panic prints and halts.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true    # keep symbols - addresses in a fault mean nothing without them

[build]
# The same bare-metal target as the Rust programs in user/: a C program
# for TheTaaJ has no other OS underneath - only this library, which is
# the `taaj` runtime with C names on it. No SSE, as there: the kernel
# does not save FPU state on a switch yet.
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static"]

# The AArch64 build is asked for by name (the Makefile's cprogs-aarch64).
[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "relocation-model=static"]

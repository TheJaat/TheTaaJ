[package]
name = "user"
version = "0.1.0"
edition = "2021"
description = "TheTaaJ user programs, and the small runtime they share"
publish = false

[lib]
name = "taaj"
path = "src/lib.rs"
test = false

[dependencies]
abi = { path = "../kernel/abi" }
input = { path = "../input" }
console = { path = "../console" }
heap = { path = "../heap" }
fileserver = { path = "../fileserver" }
taajfs = { path = "../taajfs" }
virtio = { path = "../virtio" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Small rather than fast: most of these programs are carried inside the
# kernel image, and the bootloader loads a kernel only if it ends below
# 2 MiB (see kernel/kernel64/linker.ld). Symbols are stripped for the same
# reason - to turn a fault address into a function, build once with
# `strip = false`.
opt-level = "s"
lto = true
codegen-units = 1
strip = true

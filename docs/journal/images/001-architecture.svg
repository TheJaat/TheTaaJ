<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>

  <!-- User space -->
  <rect x="40" y="20" width="470" height="62" rx="8" fill="#eef2f7" stroke="#8a99ad"/>
  <text x="275" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Applications &amp; desktop</text>
  <text x="275" y="68" text-anchor="middle" font-size="13" fill="#4b5563">C · C++ · Rust</text>

  <rect x="530" y="20" width="230" height="62" rx="8" fill="#eef2f7" stroke="#8a99ad"/>
  <text x="645" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">POSIX layer (libc)</text>
  <text x="645" y="68" text-anchor="middle" font-size="13" fill="#4b5563">C</text>

  <rect x="40" y="100" width="720" height="62" rx="8" fill="#eef2f7" stroke="#8a99ad"/>
  <text x="400" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">System servers</text>
  <text x="400" y="148" text-anchor="middle" font-size="13" fill="#4b5563">VFS · filesystems · network · window server · registry · init   —   Rust · C++</text>

  <rect x="40" y="180" width="720" height="62" rx="8" fill="#eef2f7" stroke="#8a99ad"/>
  <text x="400" y="206" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2937">Drivers — user space, isolated, restartable</text>
  <text x="400" y="228" text-anchor="middle" font-size="13" fill="#4b5563">virtio · NVMe · AHCI · xHCI · HD Audio   —   Rust</text>

  <!-- Boundary -->
  <line x1="40" y1="262" x2="760" y2="262" stroke="#b45309" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="245" y="252" width="310" height="20" fill="#ffffff"/>
  <text x="400" y="267" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">user / kernel boundary — syscalls + capabilities</text>

  <!-- Kernel -->
  <rect x="40" y="282" width="720" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="308" text-anchor="middle" font-size="16" font-weight="600" fill="#1e3a8a">Kernel core — portable</text>
  <text x="400" y="330" text-anchor="middle" font-size="13" fill="#1e40af">scheduler · IPC endpoints · capabilities · virtual memory   —   Rust</text>

  <!-- Arch layer -->
  <rect x="40" y="362" width="226" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="153" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">arch/x86_64</text>
  <text x="153" y="410" text-anchor="middle" font-size="12.5" fill="#4b5563">ACPI · APIC · asm + Rust</text>

  <rect x="287" y="362" width="226" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="400" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">arch/aarch64</text>
  <text x="400" y="410" text-anchor="middle" font-size="12.5" fill="#4b5563">Device Tree / ACPI · GIC</text>

  <rect x="534" y="362" width="226" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="647" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">arch/riscv64</text>
  <text x="647" y="410" text-anchor="middle" font-size="12.5" fill="#4b5563">Device Tree · PLIC · SBI</text>

  <!-- Handoff -->
  <rect x="40" y="442" width="720" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="400" y="465" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">TaajBootInfo</text>
  <text x="400" y="484" text-anchor="middle" font-size="12.5" fill="#92400e">one handoff structure — the kernel never knows how it was booted</text>

  <!-- Bootloaders -->
  <rect x="40" y="512" width="226" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="153" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">BIOS loader</text>
  <text x="153" y="560" text-anchor="middle" font-size="12.5" fill="#4b5563">x86_64 · C + asm</text>

  <rect x="287" y="512" width="226" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="400" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">UEFI loader</text>
  <text x="400" y="560" text-anchor="middle" font-size="12.5" fill="#4b5563">x86_64 · AArch64 · C</text>

  <rect x="534" y="512" width="226" height="62" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="647" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">U-Boot / firmware</text>
  <text x="647" y="560" text-anchor="middle" font-size="12.5" fill="#4b5563">AArch64 · RISC-V</text>
</svg>
